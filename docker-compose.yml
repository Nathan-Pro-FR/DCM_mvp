services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: dcm_user
      POSTGRES_PASSWORD: dcm_pass
      POSTGRES_DB: dcm_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcm_user -d dcm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: always
    env_file: .env
    command: python -m app.bot
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: always
    env_file: .env
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
